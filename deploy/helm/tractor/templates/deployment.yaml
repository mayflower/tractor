apiVersion: apps/v1
kind: Deployment
metadata:
  name: tractor
  labels:
    {{- include "tractor.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 2
  # The volume is ReadWriteOnce, so the old pod must stop before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "tractor.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tractor.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: fetch-model
          image: {{ include "tractor.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command:
            - python
            - -c
            - |
              import hashlib, os, pathlib, sys
              from huggingface_hub import snapshot_download
              target = pathlib.Path("/model")
              expected = os.environ["WEIGHTS_SHA256"]
              revision = os.environ["MODEL_REVISION"]
              marker = target / ".revision"
              weights = target / "model.safetensors"

              def digest(path):
                  h = hashlib.sha256()
                  with path.open("rb") as handle:
                      for block in iter(lambda: handle.read(1 << 20), b""):
                          h.update(block)
                  return h.hexdigest()

              if marker.exists() and marker.read_text().strip() == revision and weights.exists():
                  print("model revision already present", revision)
                  sys.exit(0)
              snapshot_download(os.environ["MODEL_REPOSITORY"], revision=revision, local_dir=str(target))
              actual = digest(weights)
              if actual != expected:
                  weights.unlink()
                  sys.exit(f"weights checksum mismatch: {actual}")
              marker.write_text(revision)
              print("model installed", revision)
          env:
            - {name: MODEL_REPOSITORY, value: {{ .Values.model.repository | quote }}}
            - {name: MODEL_REVISION, value: {{ .Values.model.revision | quote }}}
            - {name: WEIGHTS_SHA256, value: {{ .Values.model.weightsSha256 | quote }}}
            # The image is offline by default; this one step is allowed to download.
            - {name: HF_HUB_OFFLINE, value: "0"}
            - {name: TRANSFORMERS_OFFLINE, value: "0"}
            - {name: HF_HOME, value: /tmp/hf}
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.model.tokenSecretName }}
                  key: HF_TOKEN
          volumeMounts:
            - {name: model, mountPath: /model}
            - {name: tmp, mountPath: /tmp}
      containers:
        - name: tractor
          image: {{ include "tractor.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          args: [--model, /model, --device, cpu, --host, 0.0.0.0, --port, "8000"]
          ports:
            - {name: http, containerPort: 8000}
          env:
            - {name: OMP_NUM_THREADS, value: {{ .Values.threads | quote }}}
            - {name: MKL_NUM_THREADS, value: {{ .Values.threads | quote }}}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: model, mountPath: /model, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: model
          persistentVolumeClaim:
            claimName: tractor-model
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
