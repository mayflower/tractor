apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tractor-model
  labels:
    {{- include "tractor.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.model.persistence.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.model.persistence.size }}
